[project]
name = "clearance"
version = "0.1.0"
description = "Tells you how hard it is to get an OAuth app approved with any provider, with every claim labelled by how it was verified."
requires-python = ">=3.11"

# Mirrors requirements.txt. Both are declared because a host may read either
# one; a pyproject with no dependencies would deploy an app with nothing
# installed.
dependencies = [
    "streamlit==1.66.1",
    "google-genai==2.34.0",
    "firecrawl==4.54.0",
    "pydantic==2.14.2",
    "python-dotenv==1.2.4",
    "markdownify==1.2.3",
    "beautifulsoup4==4.15.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
